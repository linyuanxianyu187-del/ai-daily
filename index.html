<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 AI 每日资讯 — 2026年07月13日</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .hero {
            text-align: center;
            padding: 40px 20px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }
        
        .hero h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }
        
        .hero .date {
            font-size: 18px;
            opacity: 0.9;
        }
        
        .hero .stats {
            margin-top: 16px;
            font-size: 15px;
            opacity: 0.85;
        }
        
        .hero .stats span {
            margin: 0 12px;
        }
        
        .card {
            background: white;
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 13px;
            color: #86868b;
        }
        
        .region {
            font-size: 16px;
        }
        
        .source {
            background: #f0f0f5;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
            color: #1d1d1f;
        }
        
        .time {
            margin-left: auto;
        }
        
        .title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .title a {
            color: #1d1d1f;
            text-decoration: none;
        }
        
        .title a:hover {
            color: #667eea;
        }
        
        .summary {
            font-size: 14px;
            color: #6e6e73;
            line-height: 1.6;
        }
        
        .footer {
            text-align: center;
            padding: 30px;
            color: #86868b;
            font-size: 13px;
        }
        
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #86868b;
        }
        
        .empty .emoji {
            font-size: 64px;
            margin-bottom: 16px;
        }
        
        /* 响应式：手机 */
        @media (max-width: 600px) {
            body { padding: 12px; }
            .hero h1 { font-size: 28px; }
            .card { padding: 16px; }
            .title { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>🤖 AI 每日资讯</h1>
            <div class="date">2026年07月13日</div>
            <div class="stats">
                <span>📰 0 篇文章</span>
                <span>🇺🇸 0 篇</span>
                <span>🇨🇳 0 篇</span>
            </div>
        </div>
        
        <div class="articles">
            <div class="empty"><div class="emoji">☕️</div><p>今天还没有新文章，晚点再来看看~</p></div>
        </div>
        
        <div class="footer">
            🤖 由 AI 日报系统自动生成 · 每天更新 · 数据来源见文章标注
        </div>
    </div>
</body>
</html>
